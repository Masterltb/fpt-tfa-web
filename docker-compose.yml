# Docker Compose for TFA local development
# Usage: docker-compose up -d

services:
  postgres:
    image: postgres:16-alpine
    container_name: tfa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: tfa_dev
      POSTGRES_USER: tfa
      POSTGRES_PASSWORD: tfa_local_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tfa -d tfa_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: tfa-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@tfa.local
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
